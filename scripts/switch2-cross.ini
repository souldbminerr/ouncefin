[binaries]
c = 'aarch64-none-elf-gcc'
cpp = 'aarch64-none-elf-g++'
ar = 'aarch64-none-elf-ar'
strip = 'aarch64-none-elf-strip'
pkg-config = '/opt/devkitpro/portlibs/switch2/bin/aarch64-none-elf-pkg-config'

[host_machine]
system = 'horizon'
cpu_family = 'aarch64'
cpu = 'cortex-a78c'
endian = 'little'

[properties]
c_args = ['-D__SWITCH__', '-D__SWITCH2__', '-I/opt/devkitpro/portlibs/switch2/include', '-I/opt/devkitpro/portlibs/switch/include', '-isystem', '/opt/devkitpro/libounce/include']
cpp_args = ['-D__SWITCH__', '-D__SWITCH2__', '-I/opt/devkitpro/portlibs/switch2/include', '-I/opt/devkitpro/portlibs/switch/include', '-isystem', '/opt/devkitpro/libounce/include']
c_link_args = ['-L/opt/devkitpro/portlibs/switch2/lib', '-L/opt/devkitpro/portlibs/switch/lib', '-L/opt/devkitpro/libounce/lib', '-lounce']
cpp_link_args = ['-L/opt/devkitpro/portlibs/switch2/lib', '-L/opt/devkitpro/portlibs/switch/lib', '-L/opt/devkitpro/libounce/lib', '-lounce']
