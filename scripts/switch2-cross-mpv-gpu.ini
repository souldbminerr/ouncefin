# Switch 2 meson cross file for building mpv with the deko3d (drako3d)
# render backend. Extends scripts/switch2-cross.ini with:
#   - the in-repo deko3d->drako3d compat headers (<deko3d.h> shims)
#   - -ldrako3d (deko3d API implemented by drako3d on Switch 2)
# Use with: -Ddeko3d=enabled -Ddeko3d_precompiled=true -Dgl=disabled
[binaries]
c = 'aarch64-none-elf-gcc'
cpp = 'aarch64-none-elf-g++'
ar = 'aarch64-none-elf-ar'
strip = 'aarch64-none-elf-strip'
pkg-config = '/opt/devkitpro/portlibs/switch2/bin/aarch64-none-elf-pkg-config'

[host_machine]
system = 'horizon'
cpu_family = 'aarch64'
cpu = 'cortex-a78c'
endian = 'little'

[properties]
c_args = ['-D__SWITCH__', '-D__SWITCH2__', '-I/opt/devkitpro/portlibs/switch2/include', '-I/opt/devkitpro/portlibs/switch/include', '-isystem', '/opt/devkitpro/libounce/include', '-I/c/Users/sould/Documents/GitHub/switchfin/cmake/switch2/drako3d-compat']
cpp_args = ['-D__SWITCH__', '-D__SWITCH2__', '-I/opt/devkitpro/portlibs/switch2/include', '-I/opt/devkitpro/portlibs/switch/include', '-isystem', '/opt/devkitpro/libounce/include', '-I/c/Users/sould/Documents/GitHub/switchfin/cmake/switch2/drako3d-compat']
c_link_args = ['-L/opt/devkitpro/portlibs/switch2/lib', '-L/opt/devkitpro/portlibs/switch/lib', '-L/opt/devkitpro/libounce/lib', '-lounce', '-ldrako3d']
cpp_link_args = ['-L/opt/devkitpro/portlibs/switch2/lib', '-L/opt/devkitpro/portlibs/switch/lib', '-L/opt/devkitpro/libounce/lib', '-lounce', '-ldrako3d']
